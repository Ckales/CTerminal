name: cterminal
description: "CTerminal：跨平台桌面终端（Flutter 界面 + Rust 内核）"
publish_to: 'none'

# 与 crates/cterm-core/Cargo.toml 保持一致（界面显示的版本号和新版本检查以后者为准）
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cterminal_rust:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
