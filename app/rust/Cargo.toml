[package]
name = "cterminal_rust"
version = "0.1.0"
description = "flutter_rust_bridge surface over cterm-core"
authors = ["Ckales"]
license = "MIT"
edition = "2021"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
cterm-core = { path = "../../crates/cterm-core" }
flutter_rust_bridge = "=2.13.0"
serde = "1"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
# 发布包体积：去符号 + LTO
strip = true
lto = "thin"
codegen-units = 1
