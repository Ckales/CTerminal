[package]
name = "cterm-core"
version = "0.1.0"
description = "Terminal engine, connections and config for CTerminal"
authors = ["Ckales"]
license = "MIT"
edition = "2021"
rust-version = "1.95"

[lib]
name = "cterm_core"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
serialport = { version = "4", default-features = false }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "fs", "process"] }
russh-sftp = "3"
# 新版本检查：rustls + ring（与 russh 共用 ring），不引入 openssl
ureq = { version = "3", default-features = false, features = ["rustls"] }
zmodem2 = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
